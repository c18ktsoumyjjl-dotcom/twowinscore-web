{% macro topnav(page) %}<nav class="tn"><a href="/" class="tb {{'on' if page in ('home','game')}}">스코어</a><a href="/standings" class="tb {{'on' if page=='standings'}}">순위</a>{% if me %}<span class="mpw"><button type="button" class="tb pri mpb {{'on' if page=='me'}}" aria-haspopup="true" aria-expanded="false">마이페이지</button>{{ mypanel() }}</span>{% else %}<a href="/login" class="tb {{'on' if page=='login'}}">로그인</a><a href="/signup" class="tb pri {{'on' if page=='signup'}}">회원가입</a>{% endif %}<a href="https://t.me/twowinscore_cs_bot" class="tb tgi" target="_blank" rel="noopener noreferrer" aria-label="텔레그램 고객센터" title="텔레그램 고객센터"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path fill="currentColor" d="M21.6 3.2a1 1 0 0 0-1.03-.15L2.7 10.1a1 1 0 0 0 .05 1.88l4.6 1.53 1.75 5.6a1 1 0 0 0 1.67.4l2.55-2.6 4.6 3.4a1 1 0 0 0 1.57-.6l2.45-14.7a1 1 0 0 0-.34-.81ZM9.4 13.2l8.1-6.3-6.7 7.3-.3 3-1.1-4Z"/></svg></a></nav>{% endmacro %}
{% macro mypanel() %}<div class="mpp" hidden><p class="mpt">간단 내정보</p>{% if lv %}<div class="mpl"><img src="/static/tiers/t{{lv.i}}_128.webp?v=1" width="48" height="48" alt="{{lv.name}}"><div><b>{{lv.name}}</b><small>{{lv.pts}}점{% if lv.next %} · {{lv.next}}까지 {{lv.need}}점{% endif %}</small><span class="lv-bar"><i style="width:{{lv.pct}}%"></i></span></div></div>{% endif %}
<dl><dt>아이디</dt><dd>{{me.login_id}}</dd><dt>닉네임</dt><dd>{{me.nick}}</dd></dl><a class="mpa" href="/me">상세 마이페이지</a><form method="post" action="/logout"><input type="hidden" name="_csrf" value="{{csrf_token()}}"><button class="mpo">로그아웃</button></form></div>{% endmacro %}
