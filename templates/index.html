{% extends "base.html" %}{% block title %}{{label}} 경기{% endblock %}
{% block bodycls %}has-hero{% endblock %}
{% block header %}<div class="hero5">
<picture><source media="(max-width:700px)" type="image/webp" srcset="/static/hero_m1x.webp 540w, /static/hero_m2x.webp 1080w" sizes="100vw">
<source media="(max-width:700px)" srcset="/static/hero_m1x.jpg 540w, /static/hero_m2x.jpg 1080w" sizes="100vw">
<source type="image/webp" srcset="/static/band_1x.webp 1440w, /static/band_2x.webp 2560w" sizes="100vw">
<img src="/static/band_1x.jpg" srcset="/static/band_1x.jpg 1440w, /static/band_2x.jpg 2560w" sizes="100vw" alt="TwowinSCORE" fetchpriority="high"></picture>
<p class="tag5">국내·해외 축구·야구·농구·배구·아이스하키 실시간 스코어</p>
<div class="hero-nav"><nav><a href="/" class="on">스코어</a><a href="/standings">순위</a></nav><button class="theme" id="theme" aria-label="화면 모드">◐</button></div>
</div>
<div class="sbar" id="sbar"><div class="wrap">
<div class="dates5"><a class="logo mini" href="/"><span class="w">Twowin</span><span class="s">SCORE</span></a><div class="seg"><a href="/?d={{yday}}" class="{{'on' if d==yday}}">어제</a><a href="/?d={{today}}" class="{{'on' if d==today}}">오늘</a><a href="/?d={{tmr}}" class="{{'on' if d==tmr}}">내일</a></div>
<label class="cal5" title="날짜 선택"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/><path d="M7 14h2M11 14h2M15 14h2M7 17.5h2M11 17.5h2"/></svg><input type="date" id="cal" value="{{d}}" min="{{dmin}}" max="{{dmax}}"></label></div>
<label class="search5"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="q" type="search" placeholder="팀 검색 (예: LG, 다저스)" autocomplete="off"></label>
<div class="sports5" id="sports"></div><div class="chips chips5" id="chips"></div></div></div>
<div class="wrap dlabel">{{label}}</div>{% endblock %}
{% block body %}<button id="chatFab" class="fab">💬 라운지 <span id="fabN"></span></button><aside id="lounge" class="lounge" hidden></aside><div id="status" class="status"></div><div id="list"><p class="empty">불러오는 중…</p></div>{% endblock %}
{% block js %}<script src="/static/chat.js?v=2"></script><script>
const D="{{d}}";const SPORTS=['전체','축구','야구','농구','배구','아이스하키'];let SP=localStorage.getItem('tw_sport')||'전체',OPEN=null,PV={};let F=new URLSearchParams(location.search).get('f')||'all',Q='',DATA=null,PREV={};
const fav=()=>{try{return JSON.parse(localStorage.getItem('tw_fav')||'[]')}catch(e){return[]}};
const fk=(g,s)=>g.kind+':'+g[s].id;
const isFav=g=>{const f=fav();return f.includes(fk(g,'L'))||f.includes(fk(g,'R'))};
function toggleFav(id,e){e.preventDefault();e.stopPropagation();let f=fav();f=f.includes(id)?f.filter(x=>x!==id):[...f,id];localStorage.setItem('tw_fav',JSON.stringify(f));render()}
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function teamFav(g){const f=fav();return f.includes(fk(g,'L'))||f.includes(fk(g,'R'))}
function toggleGame(k,e){e.preventDefault();e.stopPropagation();const g=DATA.games.find(x=>x.key===k);if(!g)return;let f=fav();const ids=[fk(g,'L'),fk(g,'R')];
 f=teamFav(g)?f.filter(x=>!ids.includes(x)):[...new Set([...f,...ids])];localStorage.setItem('tw_fav',JSON.stringify(f));render()}
function tm(t,s){const lg=t.logo?`<img src="${esc(t.logo)}" alt="" loading="lazy">`:'<i class="nologo"></i>';return `<div class="tm5 ${s} ${t.win?'win':''}">${s==='L'?`<span class="nm">${esc(t.name)}</span>${lg}`:`${lg}<span class="nm">${esc(t.name)}</span>`}</div>`}
function tbl(t){if(!t)return'';const ex=t.ext||[];const cell=v=>v==null?'-':esc(v);
 return `<div class="lsw"><table class="ls6"><tr><th class="t">팀</th>${t.cols.map(c=>`<th>${esc(c)}</th>`).join('')}<th class="o">${esc(t.tlab)}</th>${ex.map(c=>`<th>${c}</th>`).join('')}</tr>`+
 t.rows.map((r,i)=>`<tr><td class="t">${esc(r.name)}${i?'<em>홈</em>':''}</td>${r.vals.map((v,j)=>{const o=t.rows[1-i].vals[j];return `<td class="${typeof v==='number'&&typeof o==='number'&&v>o?'hi':''}">${cell(v)}</td>`}).join('')}<td class="o">${cell(r.T)}</td>${r.ext.map(cell).map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')+'</table></div>'}
const RES={W:'승',L:'패',D:'무'};
function pv(j){let h=tbl(j.table);
 if(j.starters&&(j.starters.away||j.starters.home)){const p=x=>x?`<b>${esc(x.name)}</b>${x.era?` <small>ERA ${esc(x.era)}</small>`:''}`:'<small>미발표</small>';h+=`<div class="pv-b"><h4>선발 투수</h4><div class="two6"><div>${p(j.starters.away)}</div><div class="r">${p(j.starters.home)}</div></div></div>`}
 if(j.forms.length)h+=`<div class="pv-b"><h4>최근 5경기</h4>${j.forms.map(f=>`<div class="fm6"><span>${esc(f.name)}</span><span class="form">${f.rows.slice().reverse().map(r=>`<i class="r${r.r}">${RES[r.r]}</i>`).join('')}</span></div>`).join('')}</div>`;
 if(j.h2h)h+=`<div class="pv-b"><h4>맞대결 최근 ${j.h2h.n}경기</h4><p class="h6">${esc(j.L)} <b>${j.h2h.L}승</b> · <b>${j.h2h.R}승</b> ${esc(j.R)}</p></div>`;
 if(j.pos&&(j.pos.L||j.pos.R)){const s=x=>x?`<b>${x.rank}위</b> <small>${x.win??''}${x.win!=null?'승 ':''}${x.draw!=null?x.draw+'무 ':''}${x.lose??''}${x.lose!=null?'패':''}${x.pts!=null&&j.kind!=='baseball'&&j.kind!=='basketball'?' · '+x.pts+'점':''}</small>`:'-';h+=`<div class="pv-b"><h4>순위${j.pos.section?' · '+esc(j.pos.section):''}</h4><div class="two6"><div>${esc(j.L)} ${s(j.pos.L)}</div><div class="r">${esc(j.R)} ${s(j.pos.R)}</div></div></div>`}
 if(j.plays)h+=`<div class="pv-b"><h4>문자중계</h4>${j.plays.items.map(x=>`<p class="pl6 ${x.hot?'hot':''}">${esc(x.t)}</p>`).join('')}</div>`;
 return h+`<a class="more6" href="${esc(j.url)}">상세 페이지 보기 ›</a>`}
async function loadPv(k){try{const j=await (await fetch('/api/preview/'+encodeURIComponent(k)+'?d='+D)).json();PV[k]=j.error?'<p class="empty">정보를 불러오지 못했어요.</p>':pv(j);PV[k+'@']=Date.now()}catch(e){PV[k]='<p class="empty">정보를 불러오지 못했어요.</p>'}
 const el=document.querySelector('.pv6[data-k="'+CSS.escape(k)+'"] .pvin');if(el)el.innerHTML=PV[k]}
function toggleRow(k){const was=OPEN===k;document.querySelectorAll('.pv6.open').forEach(x=>x.classList.remove('open'));document.querySelectorAll('.g5.op').forEach(x=>x.classList.remove('op'));
 if(was){OPEN=null;return}OPEN=k;const el=document.querySelector('.pv6[data-k="'+CSS.escape(k)+'"]');if(!el)return;el.classList.add('open');el.previousElementSibling.classList.add('op');
 if(!PV[k]||Date.now()-PV[k+'@']>30000)loadPv(k)}
function row(g){const sc=g.L.score!=null,p=PREV[g.key],ch=p&&p!==g.L.score+':'+g.R.score&&sc,on=teamFav(g);
 const lead=sc&&g.L.score!==g.R.score?(g.L.score>g.R.score?'L':'R'):'';
 let top='';if(g.state==='live')top=`<span class="pill">● LIVE ${esc(g.badge)}</span>`;else if(sc)top=`<span class="fin">${esc(g.badge)}</span>`;
 const mid=sc?`<div class="score5"><b class="${lead==='L'?'lead':''}">${g.L.score}</b><span>:</span><b class="${lead==='R'?'lead':''}">${g.R.score}</b></div>`:`<div class="vs5">${g.state==='scheduled'?'vs':esc(g.badge)}</div>`;
 const op=OPEN===g.key;return `<div class="g5 ${g.state} ${ch?'flash':''} ${op?'op':''}" role="button" tabindex="0" data-k="${esc(g.key)}">
 <div class="time5">${esc(g.time)}${g.sub?`<small>${esc(g.sub)}</small>`:''}</div>${tm(g.L,'L')}<div class="mid5">${top}${mid}</div>${tm(g.R,'R')}
 <button class="star5 ${on?'on':''}" onclick="toggleGame('${g.key}',event)" aria-label="즐겨찾기">${on?'★':'☆'}</button></div><div class="pv6 ${op?'open':''}" data-k="${esc(g.key)}"><div class="pvin">${PV[g.key]||'<p class="empty">불러오는 중…</p>'}</div></div>`}
function render(){if(!DATA)return;const all=DATA.games,q=Q.trim().toLowerCase();
 const cnt=s=>s==='전체'?all.length:all.filter(g=>g.sport===s).length;if(!SPORTS.includes(SP))SP='전체';
 document.getElementById('sports').innerHTML=SPORTS.map(s=>`<button class="${s===SP?'on':''}" data-s="${s}">${s}${cnt(s)?` <small>${cnt(s)}</small>`:''}</button>`).join('');
 const gs=SP==='전체'?all:all.filter(g=>g.sport===SP);
 const leagues=[...new Map(gs.map(g=>[g.league,g.lorder])).entries()].sort((a,b)=>a[1]-b[1]).map(x=>x[0]);
 const nl=gs.filter(g=>g.state==='live').length,nf=gs.filter(isFav).length;
 const chips=[['all','전체 '+gs.length],...(nl?[['live','● LIVE '+nl]]:[]),...(nf?[['fav','★ '+nf]]:[]),...leagues.map(l=>[l,l+' '+gs.filter(g=>g.league===l).length])];
 if(!chips.some(c=>c[0]===F))F='all';
 document.getElementById('chips').innerHTML=chips.map(c=>`<button class="${c[0]===F?'on':''} ${c[0]==='live'?'lv':''}" data-f="${esc(c[0])}">${esc(c[1])}</button>`).join('');
 let v=gs.filter(g=>F==='all'||(F==='live'?g.state==='live':F==='fav'?isFav(g):g.league===F));
 if(q)v=v.filter(g=>(g.L.name+' '+g.R.name+' '+g.league).toLowerCase().includes(q));
 const rank=g=>g.state==='live'?(isFav(g)?0:1):(isFav(g)?1.5:2);
 const pin=v.filter(g=>rank(g)<2).sort((a,b)=>rank(a)-rank(b)||a.ts-b.ts);
 const rest=v.filter(g=>rank(g)>=2);let h='';
 if(pin.length)h+=`<section><h2 class="pin"><span class="lh">${pin.some(g=>g.state==='live')?'● 진행 중':''}${pin.some(g=>g.state==='live')&&pin.some(isFav)?' · ':''}${pin.some(isFav)?'★ 즐겨찾기':''}</span></h2>${pin.map(row).join('')}</section>`;
 const lab=k=>'<span class="ha5">원정 | 홈</span>';
 for(const l of leagues){const x=rest.filter(g=>g.league===l);if(x.length)h+=`<section><h2><span class="lh">${x[0].emoji} ${esc(l)}</span>${lab(x[0].kind)}</h2>${x.map(row).join('')}</section>`}
 document.getElementById('list').innerHTML=h||`<p class="empty">${q?'검색 결과가 없어요.':F==='live'?'지금 진행 중인 경기가 없어요.':'이 날 경기가 없어요.'}</p>`;
 const live=gs.some(g=>g.state==='live');
 document.getElementById('status').innerHTML=(DATA.failed.length?'<span class="warn">일부 종목을 불러오지 못했어요 · </span>':'')+(live?'<i class="dot"></i> 실시간 · 점수 '+(DATA.upstream||15)+'초마다 갱신 · ':'')+DATA.updated+' 기준';
 gs.forEach(g=>PREV[g.key]=g.L.score+':'+g.R.score)}
document.getElementById('sports').onclick=e=>{const b=e.target.closest('button');if(b){SP=b.dataset.s;F='all';localStorage.setItem('tw_sport',SP);render()}};
document.getElementById('list').addEventListener('click',e=>{if(e.target.closest('.star5,.pv6'))return;const r=e.target.closest('.g5');if(r)toggleRow(r.dataset.k)});
document.getElementById('list').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.classList.contains('g5'))toggleRow(e.target.dataset.k)});
document.getElementById('chips').onclick=e=>{const b=e.target.closest('button');if(b){F=b.dataset.f;render()}};
document.getElementById('q').oninput=e=>{Q=e.target.value;render()};
document.getElementById('cal').onchange=e=>{if(e.target.value)location.href='/?d='+e.target.value};
async function load(){try{const r=await fetch('/api/games?d='+D,{cache:'no-store'});DATA=await r.json();render();if(OPEN&&Date.now()-(PV[OPEN+'@']||0)>30000&&DATA.games.some(g=>g.key===OPEN&&g.state==='live'))loadPv(OPEN)}catch(e){document.getElementById('status').textContent='연결이 불안정해요. 다시 시도 중…'}}
const LG=document.getElementById('lounge'),FAB=document.getElementById('chatFab');let CH=null;
const fabN=n=>document.getElementById('fabN').textContent=n?n+'명':'';
function openChat(){document.body.classList.add('chat-open');LG.hidden=false;FAB.hidden=true;if(!CH)CH=TWChat.mount(LG,'lounge',{title:'💬 라운지 채팅',close:closeChat,lazy:true,onOnline:fabN});CH.start();localStorage.setItem('tw_chat_open','1')}
function closeChat(){document.body.classList.remove('chat-open');LG.hidden=true;FAB.hidden=false;CH&&CH.stop();localStorage.setItem('tw_chat_open','0')}
FAB.onclick=openChat;
async function ping(){if(!LG.hidden||document.hidden)return;try{const j=await (await fetch('/api/chat-online?cid='+TWChat.cid())).json();fabN(j.online)}catch(e){}}
ping();setInterval(ping,20000);
if(localStorage.getItem('tw_chat_open')==='1'||(innerWidth>=1100&&localStorage.getItem('tw_chat_open')!=='0'))openChat();
load();setInterval(()=>{if(!document.hidden)load()},5000);
</script>{% endblock %}
