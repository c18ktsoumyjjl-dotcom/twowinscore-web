services:
  - type: web
    name: twowinscore-web
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 8 --timeout 60
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: TZ
        value: Asia/Seoul
      - key: CACHE_DIR
        value: /tmp/twowinscore-cache
      - key: API_SPORTS_KEY
        sync: false   # Render 대시보드에서 직접 입력 (저장소에 넣지 않음)
