services:
  - type: web
    name: twowinscore-web
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 8 --timeout 60
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: TZ
        value: Asia/Seoul
      - key: CACHE_DIR
        value: /tmp/twowinscore-cache
      - key: API_SPORTS_KEY
        sync: false   # Render 대시보드에서 직접 입력 (저장소에 넣지 않음)
      # 회원/관리자 (값은 Render 대시보드에서 직접 입력, 저장소에 넣지 않음)
      - key: SECRET_KEY
        sync: false
      - key: MEMBER_ENC_KEY
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # 저장소: Render Disk 를 /var/data 에 붙이고 DATA_DIR=/var/data, 또는 Render Postgres 의 DATABASE_URL 을 설정
